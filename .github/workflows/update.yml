name: Update flake inputs

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-flake-inputs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      default-branch: ${{ steps.base.outputs.default-branch }}
      tested-base-sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture tested base
        id: base
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "default-branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Update inputs
        run: nix flake update

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload updated lock file
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updated-flake-lock
          path: flake.lock
          if-no-files-found: error
          retention-days: 1

  create-pull-request:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull-request-head-sha: ${{ steps.create-pr.outputs.pull-request-head-sha }}
      pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.generate.outputs.tested-base-sha }}

      - name: Download updated lock file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: updated-flake-lock
          path: .

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          add-paths: flake.lock
          commit-message: "chore(flake): update inputs"
          title: "chore(flake): update inputs"
          body: "Automated weekly update of all flake inputs."
          branch: update/flake-inputs
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true

      - name: Verify pull request was created
        env:
          PR_HEAD_SHA: ${{ steps.create-pr.outputs.pull-request-head-sha }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          if [[ -z "$PR_NUMBER" || -z "$PR_HEAD_SHA" ]]; then
            echo "The update changed flake.lock but no pull request was created." >&2
            exit 1
          fi

  check:
    needs: create-pull-request
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.create-pull-request.outputs.pull-request-head-sha }}
      push-cache: true
    secrets:
      CACHIXAUTH_TOKEN: ${{ secrets.CACHIXAUTH_TOKEN }}

  merge:
    needs:
      - generate
      - create-pull-request
      - check
    if: ${{ always() && needs.generate.outputs.changed == 'true' && needs.create-pull-request.result == 'success' && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.create-pull-request.outputs.pull-request-head-sha }}

      - name: Verify and fast-forward default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ needs.generate.outputs.default-branch }}
          PR_NUMBER: ${{ needs.create-pull-request.outputs.pull-request-number }}
          BUILT_SHA: ${{ needs.create-pull-request.outputs.pull-request-head-sha }}
          TESTED_BASE_SHA: ${{ needs.generate.outputs.tested-base-sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<< "$pr")"
          draft="$(jq -r '.draft' <<< "$pr")"
          base_ref="$(jq -r '.base.ref' <<< "$pr")"
          base_sha="$(jq -r '.base.sha' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr")"
          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"

          if [[ "$state" != "open" || "$draft" != "false" || "$base_ref" != "$DEFAULT_BRANCH" ]]; then
            echo "PR is not an open, non-draft update against the default branch." >&2
            exit 1
          fi

          if [[ "${head_repo,,}" != "${REPOSITORY,,}" || "$head_ref" != "update/flake-inputs" ]]; then
            echo "PR does not use the expected update branch in this repository." >&2
            exit 1
          fi

          if [[ "$head_sha" != "$BUILT_SHA" ]]; then
            echo "The created PR does not match the tested update." >&2
            exit 1
          fi

          if [[ "$base_sha" != "$TESTED_BASE_SHA" || "$(git rev-parse "$BUILT_SHA^")" != "$TESTED_BASE_SHA" ]]; then
            echo "The update was not created directly from the tested base." >&2
            exit 1
          fi

          mapfile -t changed_files < <(
            git diff --name-only "$TESTED_BASE_SHA" "$BUILT_SHA"
          )
          if [[ "${#changed_files[@]}" -ne 1 || "${changed_files[0]}" != "flake.lock" ]]; then
            echo "The update PR contains changes outside flake.lock." >&2
            exit 1
          fi

          git push --atomic \
            --force-with-lease="refs/heads/$DEFAULT_BRANCH:$TESTED_BASE_SHA" \
            --force-with-lease="refs/heads/$head_ref:$BUILT_SHA" \
            origin \
            "$BUILT_SHA:refs/heads/$DEFAULT_BRANCH" \
            ":refs/heads/$head_ref"
