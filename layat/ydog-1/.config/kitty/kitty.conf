font_family Moralerspace Argon HW
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0

wayland_enable_ime no

background_opacity 0.80
# On Linux, background blur is handled by the compositor (Hyprland).

window_padding_width 0
window_margin_width 0
# Do not restore a maximized window state on startup.
remember_window_size no
confirm_os_window_close 0
hide_window_decorations yes
tab_bar_style hidden

# Terminal color palette.
foreground #b2b2b2
background #000000
cursor #52ad70
cursor_text_color #000000
cursor_shape block
cursor_blink_interval 0
selection_foreground none
# Purple selection background.
selection_background #40334d

color0 #000000
color1 #cc5555
color2 #55cc55
color3 #cdcd55
color4 #5455cb
color5 #cc55cc
color6 #7acaca
color7 #cccccc
color8 #555555
color9 #ff5555
color10 #55ff55
color11 #ffff55
color12 #5555ff
color13 #ff55ff
color14 #55ffff
color15 #ffffff
