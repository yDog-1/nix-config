font_family Moralerspace Argon HW
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0

wayland_enable_ime no

background_opacity 0.80
# On Linux, background blur is handled by the compositor (Hyprland).

window_padding_width 0
window_margin_width 0
# Do not restore a maximized window state on startup.
remember_window_size no
confirm_os_window_close 0
hide_window_decorations yes
tab_bar_style hidden

# Catppuccin Mocha (https://github.com/catppuccin/kitty).
foreground #cdd6f4
background #1e1e2e
cursor #f5e0dc
cursor_text_color #1e1e2e
cursor_shape block
cursor_blink_interval 0
selection_foreground #1e1e2e
selection_background #cba6f7
url_color #f5e0dc
active_border_color #cba6f7
inactive_border_color #6c7086
bell_border_color #f9e2af

color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8
